<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Tab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-scrim"></div>
    <button id="info-btn" class="icon-btn" title="About today's background">
     <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/></svg>
     </button>
         <button id="settings-btn" class="icon-btn" title="Open settings" aria-controls="settings-panel" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="2"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 1.3v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-1.3l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-1.3-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 1.3-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-1.3v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 1.3l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 1.3 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-1.3 3Z" stroke="currentColor" stroke-width="1.5"/></svg>
         </button>
         <div class="settings-panel" id="settings-panel" aria-hidden="true">
             <div class="settings-heading">Settings</div>
             <label class="theme-toggle" for="light-mode-toggle">
                 <span>Light mode</span>
                 <input type="checkbox" id="light-mode-toggle">
             </label>
         </div>
     <div class="apod-caption" id="apod-caption"></div>
     <div class="key-banner" id="key-banner">
        <span>Using NASA'S shared demo key-add you own key for reliable backgrounds </span>
        <div class="key-banner-actions">
            <button id="key-banner-dismiss" class="key-banner-x" title="Dismiss">×</button>
        </div>
     </div>

     <section class="hero">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">-</div>

        <form class="search-form" id="search-form">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off" autofocus>
            </div>
            </form>

            <div class="quicklinks" id="quicklinks"></div>

            <button class="scroll-cue" id="scroll-cue" title="See today's news">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
     </section>

                <section class="news" id="news">
                    <div class="news-head">
                      <h1>Today's News</h1>  
                      <p>Top headlines from around the world.</p>
                    </div>
                    <div class="tabs" id="tabs"></div>
                    <div id="news-body">
                        <p class="news-status">Loading headlines...</p>
                    </div>
                </section>
/*what you looking at this is not ai coded*/
                <script type="module" src="main.js"></script>
     
</body>
</html>
